<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>RC UI · 组件示例</title>
  <link rel="stylesheet" href="rc-ui.css">
  <style>
    .rc-ui { margin: 0; min-height: 100vh; padding: 24px; }
    .rc-ui .demo-wrap { max-width: 1000px; margin: auto; }
    .rc-ui h1 { font-size: 24px; margin: 0; }
    .rc-ui h2 { font-size: 16px; margin: 0 0 12px; }
    .rc-ui p { margin: 0; }
    .rc-ui .demo-columns { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
    .rc-ui .demo-asset { border: 1px solid var(--rc-line); border-radius: 8px; padding: 12px; }
    .rc-ui .demo-toolbar { justify-content: space-between; }
    .rc-ui [hidden] { display: none !important; }
    @media (max-width: 640px) { .rc-ui { padding: 12px; } .rc-ui .demo-columns { grid-template-columns: 1fr; } }
  </style>
</head>
<body class="rc-ui" data-theme="light">
<main class="demo-wrap rc-stack">
  <header class="rc-row demo-toolbar">
    <div><h1>RC UI · 组件示例</h1><p class="rc-muted">本地交互示例，不连接业务、网络或真实文件。</p></div>
    <div class="rc-row">
      <button class="rc-button" id="theme" type="button" aria-pressed="false">深色模式</button>
      <label class="rc-label"><input id="performance" type="checkbox">低性能模式</label>
    </div>
  </header>
  <section class="rc-panel rc-stack">
    <h2>筛选与选中底板</h2>
    <div class="rc-filters" role="group" aria-label="资源类型筛选">
      <span class="rc-selection" aria-hidden="true"></span>
      <button type="button" class="rc-filter" aria-pressed="true" data-filter="all">全部</button>
      <button type="button" class="rc-filter" aria-pressed="false" data-filter="image">参考图片</button>
      <button type="button" class="rc-filter" aria-pressed="false" data-filter="video">视频</button>
    </div>
    <div id="assets" class="demo-columns" aria-label="示例资源">
      <article class="demo-asset" data-kind="image"><strong>舞台参考.png</strong><p class="rc-muted">图片示例 · 非真实素材</p></article>
      <article class="demo-asset" data-kind="video"><strong>镜头预览.mp4</strong><p class="rc-muted">视频示例 · 非真实素材</p></article>
    </div>
    <p id="filter-result" class="rc-muted" role="status">显示 2 个示例资源</p>
  </section>
  <div class="demo-columns">
    <section class="rc-card rc-stack">
      <h2>按钮与输入状态</h2>
      <p class="rc-muted">下方三个按钮用于观察 hover / press / focus，未绑定业务动作。</p>
      <div class="rc-row">
        <button class="rc-button rc-button--primary" type="button">主要按钮</button>
        <button class="rc-button" type="button">次要按钮</button>
        <button class="rc-button rc-button--danger" type="button">危险样式</button>
        <button class="rc-button" type="button" disabled>不可用</button>
      </div>
      <label class="rc-field">示例输入<input class="rc-input" placeholder="用 Tab 检查焦点轮廓" autocomplete="off"></label>
    </section>
    <section class="rc-card rc-stack">
      <h2>层级与信息密度</h2>
      <div class="rc-row"><span class="rc-badge">样式示例</span><strong class="rc-number">12 / 24</strong></div>
      <p class="rc-muted">圆角：控件 10px、卡片 14px、面板 22px。数字为可调整模板，不覆盖项目原有规格。</p>
      <p class="rc-muted">可切换浅深色、低性能模式，并在系统或开发者工具中启用减少动效进行检查。</p>
    </section>
  </div>
</main>
<script>
(() => {
  const root = document.body;
  const theme = document.getElementById('theme');
  theme.addEventListener('click', () => {
    const dark = root.dataset.theme !== 'dark';
    root.dataset.theme = dark ? 'dark' : 'light';
    theme.setAttribute('aria-pressed', String(dark));
  });
  document.getElementById('performance').addEventListener('change', event => {
    root.dataset.performance = event.target.checked ? 'low' : 'normal';
  });
  const group = document.querySelector('.rc-filters');
  const selection = group.querySelector('.rc-selection');
  const buttons = [...group.querySelectorAll('.rc-filter')];
  const cards = [...document.querySelectorAll('[data-kind]')];
  function positionSelection() {
    const selected = group.querySelector('[aria-pressed="true"]');
    if (!selected) return;
    // offsetLeft is in the scrollable group's coordinate space, not the viewport.
    selection.style.transform = `translateX(${selected.offsetLeft}px)`;
    selection.style.width = `${selected.offsetWidth}px`;
  }
  function choose(button) {
    for (const candidate of buttons) candidate.setAttribute('aria-pressed', String(candidate === button));
    let count = 0;
    for (const card of cards) {
      card.hidden = button.dataset.filter !== 'all' && card.dataset.kind !== button.dataset.filter;
      if (!card.hidden) count++;
    }
    document.getElementById('filter-result').textContent = `显示 ${count} 个示例资源`;
    positionSelection();
  }
  for (const button of buttons) button.addEventListener('click', () => choose(button));
  if ('ResizeObserver' in window) {
    const observer = new ResizeObserver(positionSelection);
    observer.observe(group);
    for (const button of buttons) observer.observe(button);
  }
  window.addEventListener('resize', positionSelection);
  document.fonts?.ready.then(positionSelection);
  positionSelection();
})();
</script>
</body>
</html>
